<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Barcode scanner — NutriLens</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/dashboard.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet"></head>
<body data-page="scanner"><div id="site-header"></div><main class="app-main"><div class="container"><div class="scanner-layout"><div><span class="eyebrow eyebrow-dark">A QUICK LOOK BEHIND THE LABEL</span><h1>Scan the snack.<br><em>Know the story.</em></h1><p>Enter a barcode to check our demo catalog, or try a sample. Live product lookup isn't connected in this demo.</p><div class="scanner-card panel"><label for="barcode-input">Barcode number</label><div class="barcode-input-wrap"><i class="bi bi-upc-scan"></i><input id="barcode-input" class="form-control" inputmode="numeric" maxlength="14" placeholder="Try 8901000000012"><button id="barcode-submit" class="btn btn-forest">Look it up</button></div><div class="scanner-error" id="scanner-error" role="status"></div><div class="scanner-divider"><span>OR TRY A DEMO</span></div><div class="demo-barcode-list"><button class="demo-barcode" data-code="8901000000012"><span class="demo-barcode-icon">🥔</span><span><strong>Potato Chips</strong><small>8901000000012</small></span><i class="bi bi-arrow-up-right"></i></button><button class="demo-barcode" data-code="8901000000040"><span class="demo-barcode-icon">🥜</span><span><strong>Roasted Salted Makhana</strong><small>8901000000040</small></span><i class="bi bi-arrow-up-right"></i></button></div></div></div><div class="scanner-illustration"><div class="scanner-frame"><div class="scanner-corner corner-tl"></div><div class="scanner-corner corner-tr"></div><div class="scanner-corner corner-bl"></div><div class="scanner-corner corner-br"></div><span class="scanner-food">🍪</span><span class="scanner-beam"></span><span class="scanner-hint"><i class="bi bi-camera"></i> Demo mode · no camera access</span></div><div class="scanner-tip"><i class="bi bi-lightbulb"></i><span><strong>Good to know</strong><small>Products are matched locally from the demo snack catalog.</small></span></div></div></div><div id="barcode-result"></div></div></main><div id="site-footer"></div><script src="js/snacks-data.js"></script><script src="js/main.js"></script></body></html>
